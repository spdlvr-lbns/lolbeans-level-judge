<script type="module">
import { loginWithGoogle, db } from "./firebase.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const msg = document.getElementById("msg");

const ANALYTICS_URL =
  "https://afhuasrcsjnjhungznnu.supabase.co/functions/v1/log-access";

// 国・都道府県を取得
async function getRegion() {
  try {
    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();

    return {
      country: data.country_name || "Unknown",
      prefecture: data.region || "Unknown"
    };
  } catch (e) {
    console.error("Region lookup failed:", e);
    return {
      country: "Unknown",
      prefecture: "Unknown"
    };
  }
}

document.getElementById("googleLogin").onclick = async () => {
  msg.textContent = "Googleログイン中...";

  try {
    const result = await loginWithGoogle();
    const user = result.user;

    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);

    if (userSnap.exists() && userSnap.data().username) {

      const username = userSnap.data().username;

      // 地域取得
      const region = await getRegion();

      console.log("Sending analytics", {
        username,
        country: region.country,
        prefecture: region.prefecture
      });

      // Supabaseへ送信
      try {
        await fetch(ANALYTICS_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username,
            country: region.country,
            prefecture: region.prefecture
          })
        });
      } catch (analyticsError) {
        console.error("Analytics error:", analyticsError);
      }

      location.href = "home.html";

    } else {

      location.href = "username.html";

    }

  } catch (error) {
    console.error(error);
    msg.textContent = "Login failed: " + error.message;
  }
};
</script>
