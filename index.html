<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOLBeans Level Judge</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      background:#f2f2f2;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      margin:0;
    }

    .box{
      background:white;
      padding:30px;
      border-radius:15px;
      width:340px;
      text-align:center;
      box-shadow:0 5px 20px rgba(0,0,0,.15);
    }

    h1{
      margin-top:0;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
    }

    #googleLogin{
      background:#4285F4;
      color:white;
    }

    #googleLogin:disabled{
      background:#9bbcf5;
      cursor:not-allowed;
    }

    #rankingBtn{
      background:#ececec;
    }

    #msg{
      margin-top:15px;
      color:#555;
      min-height:20px;
    }
  </style>

</head>

<body>

<div class="box">

  <h1>🏁 LOLBeans</h1>

  <p>Googleアカウントでログイン</p>

  <button id="googleLogin">
    🔵 Sign in with Google
  </button>

  <button id="rankingBtn">
    🏆 Overall Ranking
  </button>

  <p id="msg"></p>

</div>

<script type="module">

import { loginWithGoogle, db } from "./firebase.js";

import {
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const msg = document.getElementById("msg");
const loginButton = document.getElementById("googleLogin");
const rankingButton = document.getElementById("rankingBtn");


const ANALYTICS_URL =
"https://afhuasrcsjnjhungznnu.supabase.co/functions/v1/log-access";


// ==============================
// 地域情報取得
// ==============================

async function getRegion(){

  try{

    const response =
      await fetch("https://ipapi.co/json/");

    if(!response.ok){
      throw new Error("Region API error");
    }

    const data =
      await response.json();

    return {

      country:
        data.country_name || "Unknown",

      prefecture:
        data.region || "Unknown"

    };

  }catch(error){

    console.warn(
      "Region information could not be loaded:",
      error
    );

    return {

      country:"Unknown",

      prefecture:"Unknown"

    };

  }

}


// ==============================
// Ranking
// ==============================

rankingButton.onclick = () => {

  location.href = "ranking.html";

};


// ==============================
// Google Login
// ==============================

loginButton.onclick = async () => {

  msg.textContent = "Googleログイン中...";

  loginButton.disabled = true;

  try{

    // Google Login
    const result =
      await loginWithGoogle();

    const user =
      result.user;


    // Firestore user document
    const userRef =
      doc(db, "users", user.uid);

    const snap =
      await getDoc(userRef);


    // 地域情報
    const region =
      await getRegion();


    // ==========================
    // 既存ユーザー
    // ==========================

    if(
      snap.exists() &&
      snap.data().username
    ){

      const username =
        snap.data().username;


      // Firestoreに国を保存
      await setDoc(
        userRef,
        {
          country: region.country
        },
        {
          merge:true
        }
      );


      // Access Log
      try{

        await fetch(
          ANALYTICS_URL,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              username:
                username,

              country:
                region.country,

              prefecture:
                region.prefecture

            })
          }
        );

      }catch(logError){

        console.warn(
          "Access log failed:",
          logError
        );

      }


      // Homeへ
      location.href =
        "home.html";


    }else{

      // ==========================
      // 新規ユーザー
      // ==========================

      location.href =
        "username.html";

    }


  }catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );

    msg.textContent =
      "Login failed: " +
      (error.message || "Unknown error");

    loginButton.disabled = false;

  }

};

</script>

</body>
</html>
