<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOLBeans Level Judge</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      background:#f2f2f2;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      margin:0;
    }

    .box{
      background:white;
      padding:30px;
      border-radius:15px;
      width:340px;
      text-align:center;
      box-shadow:0 5px 20px rgba(0,0,0,.15);
    }

    h1{margin-top:0;}

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
    }

    #googleLogin{
      background:#4285F4;
      color:white;
    }

    #rankingBtn{
      background:#ececec;
    }

    #msg{
      margin-top:15px;
      color:#555;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🏁 LOLBeans</h1>

  <p>Googleアカウントでログイン</p>

  <button id="googleLogin">
    🔵 Sign in with Google
  </button>

  <button id="rankingBtn">
    🏆 Overall Ranking
  </button>

  <p id="msg"></p>

</div>

<script type="module">
import { loginWithGoogle, db } from "./firebase.js";
import {
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const msg = document.getElementById("msg");

const ANALYTICS_URL =
"https://afhuasrcsjnjhungznnu.supabase.co/functions/v1/log-access";

async function getRegion(){
  try{
    const r = await fetch("https://ipapi.co/json/");
    const d = await r.json();

    return{
      country:d.country_name || "Unknown",
      prefecture:d.region || "Unknown"
    };

  }catch{

    return{
      country:"Unknown",
      prefecture:"Unknown"
    };

  }
}

document.getElementById("rankingBtn").onclick=()=>{
  location.href="ranking.html";
};

document.getElementById("googleLogin").onclick=async()=>{

  msg.textContent="Googleログイン中...";

  try{

    const result=await loginWithGoogle();
    const user=result.user;

    const userRef=doc(db,"users",user.uid);
    const snap=await getDoc(userRef);

    if(snap.exists() && snap.data().username){

      const username=snap.data().username;
      const region=await getRegion();

      await fetch(ANALYTICS_URL,{
        await setDoc(
  doc(db, "users", user.uid),
  {
    country: region.country
  },
  { merge: true }
);
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          username,
          country:region.country,
          prefecture:region.prefecture
        })
      });

      location.href="home.html";

    }else{

      location.href="username.html";

    }

  }catch(err){

    console.error(err);
    msg.textContent="Login failed";

  }

};
</script>

</body>
</html>
