<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOLBeans Level Judge</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

.box {
  background: white;
  padding: 30px;
  border-radius: 15px;
  width: 350px;
  text-align: center;
  box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

#googleLogin {
  background: #4285F4;
  color: white;
}

#rankingBtn {
  background: #eee;
}

#msg {
  margin-top: 15px;
}

</style>

</head>


<body>

<div class="box">

  <h1>🏁 LOLBeans</h1>

  <p>Googleアカウントでログイン</p>

  <button id="googleLogin">
    🔵 Sign in with Google
  </button>

  <a href="ranking.html">
    <button id="rankingBtn">
      🏆 Overall Ranking
    </button>
  </a>

  <p id="msg"></p>

</div>


<script type="module">

import {
  loginWithGoogle,
  db
} from "./firebase.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const msg =
  document.getElementById("msg");



/*
========================================
 Analytics
========================================

このURLはアクセス記録専用API。

usernameやregionを直接Supabaseへ
書き込まず、Edge Function経由で送る。
*/

const ANALYTICS_URL =
  "https://afhuasrcsjnjhungznnu.supabase.co/functions/v1/log-access";



/*
========================================
 Google Login
========================================
*/

document
  .getElementById("googleLogin")
  .onclick = async () => {

    msg.textContent =
      "Googleログイン中...";

    try {

      const result =
        await loginWithGoogle();

      const user =
        result.user;


      console.log(
        "Logged in successfully"
      );


      /*
        Check whether this user
        already has a username
      */

      const userRef =
        doc(db, "users", user.uid);

      const userSnap =
        await getDoc(userRef);


      /*
        Username exists
      */

      if(
        userSnap.exists() &&
        userSnap.data().username
      ){

        const username =
          userSnap.data().username;


        /*
          Send username to analytics.

          重要：
          Googleメールアドレスなどは
          送信しない。
        */

        try {

          await fetch(
            ANALYTICS_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
  username: username,
  country: "Japan",
  prefecture: "Chiba"
              })
            }
          );

        }

        catch(analyticsError) {

          /*
            Analytics failure should NOT
            prevent the user from logging in.
          */

          console.error(
            "Analytics error:",
            analyticsError
          );

        }


        location.href =
          "home.html";

      }

      else {

        /*
          First login

          Username has not been created yet,
          so there is nothing to record.
        */

        location.href =
          "username.html";

      }

    }

    catch(error) {

      console.error(error);

      msg.textContent =
        "Login failed: " +
        error.message;

    }

  };

</script>

</body>

</html>
