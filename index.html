<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>LOLBeans Level Judge</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

.box {
  background: white;
  padding: 30px;
  border-radius: 15px;
  width: 350px;
  text-align: center;
  box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h1 {
  margin-bottom: 25px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

#googleLogin {
  background: #4285F4;
  color: white;
}

#rankingBtn {
  background: #eee;
}

#msg {
  margin-top: 15px;
  color: #d00;
}

</style>

</head>


<body>


<div class="box">

  <h1>🏁 LOLBeans</h1>

  <p>
    Googleアカウントでログインしてください
  </p>


  <button id="googleLogin">
    🔵 Sign in with Google
  </button>


  <a href="ranking.html">
    <button id="rankingBtn">
      🏆 Overall Ranking
    </button>
  </a>


  <p id="msg"></p>

</div>


<script type="module">

import {
  loginWithGoogle
} from "./firebase.js";


const msg =
  document.getElementById("msg");


document
  .getElementById("googleLogin")
  .onclick = async () => {

    msg.textContent = "Googleログイン中...";

    try {

      const result =
        await loginWithGoogle();

      console.log(
        "Logged in:",
        result.user.email
      );

      location.href = "home.html";

    } catch (e) {

      console.error(e);

      msg.textContent =
        "Login failed: " + e.message;

    }

  };

</script>


</body>

</html>
