<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const FUNCTION_URL =
  "https://afhuasrcsjnjhungznnu.supabase.co/functions/v1/get-access-logs";

const ADMIN_EMAILS = [
  "spdlvr83@gmail.com",
  "grgt1462@gmail.com",
  "shinobilolbean@gmail.com"
];

const logsDiv = document.getElementById("logs");
const status = document.getElementById("status");

async function loadLogs() {
  try {
    const token = await auth.currentUser.getIdToken();

    const response = await fetch(FUNCTION_URL, {
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    const data = await response.json();

    logsDiv.innerHTML = "";

    if (!response.ok) {
      status.textContent = "❌ Access denied";
      return;
    }

    status.textContent = `📊 ${data.logs.length} Access Logs`;

    data.logs.forEach(log => {
      const country = log.country || "Unknown";
      const prefecture = log.prefecture || "Unknown";

      logsDiv.innerHTML += `
        <div class="log">
          <div class="username">👤 ${log.username}</div>
          <div>🌍 ${country} / ${prefecture}</div>
          <div class="time">🕒 ${new Date(log.access_time).toLocaleString("ja-JP")}</div>
        </div>
      `;
    });

  } catch (err) {
    status.textContent = "❌ Access denied";
    logsDiv.innerHTML = "";
    console.error(err);
  }
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    status.textContent = "🔒 Please sign in with Google";
    logsDiv.innerHTML = "";
    return;
  }

  const email = (user.email || "").toLowerCase().trim();

  const isAdmin = ADMIN_EMAILS
    .map(e => e.toLowerCase().trim())
    .includes(email);

  if (!isAdmin) {
    status.textContent = "❌ Access denied";
    logsDiv.innerHTML = "";
    return;
  }

  status.textContent = "Loading logs...";
  await loadLogs();
});
</script>
