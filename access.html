<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Logs</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial,sans-serif;
  margin:0;
  padding:20px;
}
.container{max-width:900px;margin:auto;}
.card{background:#1e293b;padding:20px;border-radius:12px;}
.log{
  background:#334155;
  padding:12px;
  border-radius:8px;
  margin-top:10px;
}
.username{font-weight:bold;font-size:18px;}
.time{color:#cbd5e1;}
</style>
</head>

<body>
<div class="container">
  <h1>📊 Access Logs</h1>

  <div class="card">
    <p id="status">Checking admin...</p>
    <button id="loginBtn" style="display:none;">
  Sign in with Google
</button>
    <div id="logs"></div>
  </div>
</div>

<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const FUNCTION_URL =
"https://afhuasrcsjnjhungznnu.supabase.co/functions/v1/get-access-logs";

const ADMIN_EMAILS=[
 "spdlvr83@gmail.com",
 "grgt1462@gmail.com",
 "shinobilolbean@gmail.com"
];

const logs=document.getElementById("logs");
const status=document.getElementById("status");

async function loadLogs(){

 const token=await auth.currentUser.getIdToken();

 const res=await fetch(FUNCTION_URL,{
  headers:{
   Authorization:`Bearer ${token}`
  }
 });

 const data=await res.json();

 logs.innerHTML="";

 if(!res.ok){
   status.textContent="❌ Access denied";
   return;
 }

 status.textContent=`${data.logs.length} logs`;

 data.logs.forEach(l=>{

  logs.innerHTML+=`
  <div class="log">
    <div class="username">👤 ${l.username}</div>
    <div>🌍 ${l.country ?? "Unknown"} / ${l.prefecture ?? "Unknown"}</div>
    <div class="time">🕒 ${new Date(l.access_time).toLocaleString("ja-JP")}</div>
  </div>`;

 });

}

onAuthStateChanged(auth,async(user)=>{

 if(!user){
   status.textContent="🔒 Sign in required";
   return;
 }

 const ok=ADMIN_EMAILS.includes(
   user.email.toLowerCase()
 );

 if(!ok){
   status.textContent="❌ Access denied";
   return;
 }

 loadLogs();

});
</script>
</body>
</html>
