```html
<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Access Logs</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial,sans-serif;
  margin:0;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:#1e293b;
  border-radius:12px;
  padding:20px;
  margin-bottom:15px;
}

.log{
  background:#334155;
  padding:15px;
  border-radius:8px;
  margin-top:10px;
}

.username{
  font-size:18px;
  font-weight:bold;
}

.time{
  color:#cbd5e1;
  margin-top:5px;
}

button{
  padding:10px 15px;
  border:0;
  border-radius:8px;
  background:#7c3aed;
  color:white;
  cursor:pointer;
}

#error{
  color:#fca5a5;
}
</style>

</head>

<body>

<div class="container">

<h1>📊 Access Logs</h1>

<div class="card">

<button id="reload">
🔄 Reload
</button>

<p id="status">Loading...</p>

<div id="logs"></div>

</div>

</div>


<script>

const FUNCTION_URL =
"https://afhuasrcsjnjhungznnu.supabase.co/functions/v1/get-access-logs";


const logsDiv =
document.getElementById("logs");

const status =
document.getElementById("status");


async function loadLogs(){

  status.textContent = "Loading...";
  logsDiv.innerHTML = "";

  try{

    const response =
      await fetch(FUNCTION_URL);

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "Failed to load logs"
      );

    }

    const logs =
      data.logs || [];

    status.textContent =
      `${logs.length} access logs`;

    if(logs.length === 0){

      logsDiv.innerHTML =
        "<p>No access logs.</p>";

      return;

    }

    logs.forEach(log => {

      const div =
        document.createElement("div");

      div.className = "log";

      const username =
        document.createElement("div");

      username.className =
        "username";

      username.textContent =
        log.username || "Unknown";

      const time =
        document.createElement("div");

      time.className =
        "time";

      time.textContent =
        log.access_time
          ? new Date(log.access_time)
              .toLocaleString("ja-JP")
          : "Unknown time";

      div.appendChild(username);
      div.appendChild(time);

      logsDiv.appendChild(div);

    });

  }

  catch(error){

    console.error(error);

    status.innerHTML =
      `<span id="error">
        ❌ ${error.message}
      </span>`;

  }

}


document
  .getElementById("reload")
  .onclick = loadLogs;


loadLogs();

</script>

</body>

</html>
```
