<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Logs</title>

  <style>
    body{
      margin:0;
      background:#0f172a;
      color:white;
      font-family:Arial,sans-serif;
      padding:20px;
    }

    .container{max-width:900px;margin:auto;}
    .card{
      background:#1e293b;
      border-radius:14px;
      padding:20px;
    }

    h1,h2{margin-top:0;}

    #status{
      color:#cbd5e1;
      margin-bottom:15px;
    }

    #loginBtn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#4285F4;
      color:white;
      font-size:16px;
      cursor:pointer;
      display:none;
      margin-bottom:15px;
    }

    .rank-item,.log{
      background:#334155;
      border-radius:10px;
      padding:14px;
      margin-top:10px;
    }

    .rank-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .rank-left{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .rank-num{
      color:#fbbf24;
      font-weight:bold;
      width:32px;
    }

    .flag{font-size:22px;}
    .country-name{font-weight:bold;}
    .count{color:#86efac;font-weight:bold;}

    .username{
      font-size:18px;
      font-weight:bold;
    }

    .region{
      margin-top:6px;
      color:#bfdbfe;
    }

    .time{
      margin-top:6px;
      color:#cbd5e1;
      font-size:14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📊 Access Logs</h1>

  <div class="card">

    <p id="status">Checking admin...</p>

    <button id="loginBtn">
      🔐 Sign in with Google
    </button>

    <h2>🌍 Country Ranking</h2>
    <div id="countryRanking"></div>

    <hr style="margin:20px 0;border-color:#334155;">

    <h2>📝 Recent Access</h2>
    <div id="logs"></div>

  </div>

</div>

<script type="module">

import { auth, loginWithGoogle } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const FUNCTION_URL =
"https://afhuasrcsjnjhungznnu.supabase.co/functions/v1/get-access-logs";

const ADMIN_EMAILS = [
  "spdlvr83@gmail.com",
  "grgt1462@gmail.com",
  "shinobilolbean@gmail.com"
];

const status = document.getElementById("status");
const logs = document.getElementById("logs");
const countryRanking = document.getElementById("countryRanking");
const loginBtn = document.getElementById("loginBtn");

loginBtn.onclick = async () => {
  await loginWithGoogle();
};

function getFlag(country){
  const flags = {
    "Japan":"🇯🇵",
    "Thailand":"🇹🇭",
    "South Korea":"🇰🇷",
    "Singapore":"🇸🇬",
    "Malaysia":"🇲🇾",
    "United States":"🇺🇸",
    "United Kingdom":"🇬🇧",
    "Australia":"🇦🇺",
    "Indonesia":"🇮🇩",
    "Philippines":"🇵🇭",
    "Taiwan":"🇹🇼",
    "China":"🇨🇳"
  };
  return flags[country] || "🌍";
}

async function loadLogs(){

  try{

    const res = await fetch(FUNCTION_URL);
    const data = await res.json();

    logs.innerHTML = "";
    countryRanking.innerHTML = "";

    if(!res.ok){
      status.textContent = "❌ Failed to load logs";
      return;
    }

    status.textContent = `📊 ${data.logs.length} Access Logs`;

    // Country Ranking
    const countries = {};

    data.logs.forEach(log=>{
      const c = log.country || "Unknown";
      countries[c] = (countries[c] || 0) + 1;
    });

    const ranking = Object.entries(countries)
      .sort((a,b)=>b[1]-a[1]);

    ranking.forEach(([country,count],index)=>{

      countryRanking.innerHTML += `
        <div class="rank-item">
          <div class="rank-left">
            <div class="rank-num">#${index+1}</div>
            <div class="flag">${getFlag(country)}</div>
            <div class="country-name">${country}</div>
          </div>
          <div class="count">${count}</div>
        </div>
      `;

    });

    // Recent Access Logs
    data.logs.forEach(log=>{

      logs.innerHTML += `
        <div class="log">
          <div class="username">👤 ${log.username}</div>
          <div class="region">${getFlag(log.country)} ${log.country || "Unknown"}</div>
          <div class="time">🕒 ${new Date(log.access_time).toLocaleString("ja-JP")}</div>
        </div>
      `;

    });

  }catch(err){

    console.error(err);
    status.textContent = "❌ Connection error";

  }

}

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    status.textContent = "🔒 Admin sign in required";
    loginBtn.style.display = "block";
    logs.innerHTML = "";
    countryRanking.innerHTML = "";
    return;
  }

  loginBtn.style.display = "none";

  const email = (user.email || "").toLowerCase().trim();

  if(!ADMIN_EMAILS.includes(email)){
    status.textContent = "❌ Access denied";
    logs.innerHTML = "";
    countryRanking.innerHTML = "";
    return;
  }

  status.textContent = "Loading logs...";
  await loadLogs();

});

</script>

</body>
</html>
