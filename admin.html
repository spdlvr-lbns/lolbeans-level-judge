<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Community Admin</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0 15px;
  box-sizing:border-box;
  border:none;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#7c3aed;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

button:hover{
  background:#6d28d9;
}

button.approve{
  background:#16a34a;
}

button.approve:hover{
  background:#15803d;
}

button.reject{
  background:#dc2626;
}

button.reject:hover{
  background:#b91c1c;
}

button:disabled{
  background:#475569;
  cursor:not-allowed;
}

.event{
  background:#334155;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.submission{
  background:#334155;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.screenshot{
  max-width:100%;
  max-height:400px;
  border-radius:10px;
  margin:10px 0;
  display:block;
}

.status{
  display:inline-block;
  padding:5px 8px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
}

.pending{
  background:#92400e;
  color:#fde68a;
}

.approved{
  background:#166534;
  color:#bbf7d0;
}

.rejected{
  background:#7f1d1d;
  color:#fecaca;
}

.success{
  color:#86efac;
}

.error{
  color:#fca5a5;
}

.info{
  color:#93c5fd;
}

.admin-email{
  background:#334155;
  padding:10px;
  border-radius:8px;
  margin-bottom:15px;
  font-size:14px;
}

</style>

</head>


<body>

<div class="container">

<h1>⚙️ Community Admin</h1>

<a href="Community.html" style="color:#93c5fd;">
← Community Challenge
</a>


<!-- ================================ -->
<!-- LOGIN STATUS -->
<!-- ================================ -->

<div class="card">

<h2>👤 Admin Account</h2>

<div id="adminStatus">
Checking login...
</div>

</div>


<!-- ================================ -->
<!-- CREATE EVENT -->
<!-- ================================ -->

<div class="card">

<h2>➕ Create New Event</h2>

<label>Event Name</label>

<input
  id="eventName"
  placeholder="Community Challenge #1"
>


<label>Map</label>

<input
  id="eventMap"
  placeholder="Speeder's Speedrun 2"
>


<label>Start Date & Time</label>

<input
  id="startAt"
  type="datetime-local"
>


<label>End Date & Time</label>

<input
  id="endAt"
  type="datetime-local"
>


<button id="createEvent">
Create Event
</button>

<p id="createMessage"></p>

</div>


<!-- ================================ -->
<!-- EVENTS -->
<!-- ================================ -->

<div class="card">

<h2>📅 Events</h2>

<div id="events">
Loading...
</div>

</div>


<!-- ================================ -->
<!-- SUBMISSIONS -->
<!-- ================================ -->

<div class="card">

<h2>📨 Pending Submissions</h2>

<div id="submissions">
Loading...
</div>

</div>

</div>


<script type="module">


/*
========================================
FIREBASE
========================================
*/

import {
  auth,
  db
} from "./firebase.js";


import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  collection,
  doc,
  setDoc,
  getDocs,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/*
========================================
ADMIN EMAILS
========================================

ここに管理者として使うGmailを3つ入れる。

必ず実際のメールアドレスに変更してください。
*/

const ADMIN_EMAILS = [

  "spdlvr83@gmail.com",

  "grgt1462@gmail.com",

  "ここに3つ目のGmail@gmail.com"

];


/*
========================================
ELEMENTS
========================================
*/

const eventsDiv =
  document.getElementById("events");


const submissionsDiv =
  document.getElementById("submissions");


const createMessage =
  document.getElementById("createMessage");


const adminStatus =
  document.getElementById("adminStatus");


const createButton =
  document.getElementById("createEvent");


/*
========================================
CURRENT ADMIN
========================================
*/

let currentAdmin = null;


/*
========================================
ADMIN CHECK
========================================
*/

function checkAdmin(user){

  /*
  未ログイン
  */

  if(!user){

    return false;

  }


  /*
  メールアドレスを小文字化
  */

  const email =
    String(user.email || "")
      .toLowerCase()
      .trim();


  /*
  管理者リストも小文字化して比較
  */

  const isAdmin =
    ADMIN_EMAILS
      .map(email =>
        email.toLowerCase().trim()
      )
      .includes(email);


  return isAdmin;

}


/*
========================================
CREATE EVENT
========================================
*/

createButton.onclick = async()=>{

  /*
  管理者ログイン確認
  */

  if(!currentAdmin){

    createMessage.textContent =
      "Please login as an administrator.";

    createMessage.className =
      "error";

    return;

  }


  const name =
    document
      .getElementById("eventName")
      .value
      .trim();


  const map =
    document
      .getElementById("eventMap")
      .value
      .trim();


  const startValue =
    document
      .getElementById("startAt")
      .value;


  const endValue =
    document
      .getElementById("endAt")
      .value;


  /*
  入力確認
  */

  if(
    !name ||
    !map ||
    !startValue ||
    !endValue
  ){

    createMessage.textContent =
      "Please fill in all fields.";

    createMessage.className =
      "error";

    return;

  }


  /*
  日付をTimestampに変換
  */

  const start =
    new Date(startValue).getTime();


  const end =
    new Date(endValue).getTime();


  /*
  日付確認
  */

  if(
    Number.isNaN(start) ||
    Number.isNaN(end)
  ){

    createMessage.textContent =
      "Invalid date.";

    createMessage.className =
      "error";

    return;

  }


  if(end <= start){

    createMessage.textContent =
      "End time must be after start time.";

    createMessage.className =
      "error";

    return;

  }


  /*
  作成中
  */

  createButton.disabled = true;

  createButton.textContent =
    "Creating...";


  try{

    /*
    イベントID作成
    */

    const eventId =
      "event_" + Date.now();


    /*
    イベント保存
    */

    await setDoc(

      doc(
        db,
        "events",
        eventId
      ),

      {

        name:name,

        map:map,

        startAt:start,

        endAt:end,

        createdAt:Date.now(),

        createdBy:
          currentAdmin.uid,

        createdByEmail:
          currentAdmin.email

      }

    );


    /*
    成功
    */

    createMessage.textContent =
      "✅ Event created successfully!";

    createMessage.className =
      "success";


    /*
    フォームクリア
    */

    document
      .getElementById("eventName")
      .value = "";


    document
      .getElementById("eventMap")
      .value = "";


    document
      .getElementById("startAt")
      .value = "";


    document
      .getElementById("endAt")
      .value = "";


    /*
    イベント一覧更新
    */

    await loadEvents();

  }

  catch(error){

    console.error(
      "Create event error:",
      error
    );


    createMessage.textContent =
      "❌ Failed to create event: " +
      error.message;

    createMessage.className =
      "error";

  }

  finally{

    createButton.disabled = false;

    createButton.textContent =
      "Create Event";

  }

};


/*
========================================
LOAD EVENTS
========================================
*/

async function loadEvents(){

  try{

    const snap =
      await getDocs(
        collection(db,"events")
      );


    eventsDiv.innerHTML = "";


    const now =
      Date.now();


    /*
    イベントを日付順に並べる
    */

    const events = [];


    snap.forEach(d=>{

      events.push({

        id:d.id,

        ...d.data()

      });

    });


    events.sort(

      (a,b)=>
        Number(a.startAt) -
        Number(b.startAt)

    );


    /*
    イベント表示
    */

    events.forEach(e=>{

      const start =
        Number(e.startAt);


      const end =
        Number(e.endAt);


      let status;


      /*
      NOT STARTED
      */

      if(now < start){

        status =
          '<span class="status pending">NOT STARTED</span>';

      }


      /*
      ACTIVE
      */

      else if(now < end){

        status =
          '<span class="status approved">ACTIVE</span>';

      }


      /*
      ENDED
      */

      else{

        status =
          '<span class="status rejected">ENDED</span>';

      }


      eventsDiv.innerHTML += `

        <div class="event">

          <h3>
            ${escapeHTML(e.name)}
          </h3>

          <p>
            🗺️ ${escapeHTML(e.map)}
          </p>

          <p>
            📅
            ${formatDate(start)}
            →
            ${formatDate(end)}
          </p>

          ${status}

        </div>

      `;

    });


    /*
    イベントなし
    */

    if(events.length === 0){

      eventsDiv.textContent =
        "No events.";

    }

  }

  catch(error){

    console.error(
      "Load events error:",
      error
    );


    eventsDiv.innerHTML =
      "<p class='error'>Failed to load events.</p>";

  }

}


/*
========================================
LOAD SUBMISSIONS
========================================
*/

async function loadSubmissions(){

  try{

    const eventSnap =
      await getDocs(
        collection(db,"events")
      );


    submissionsDiv.innerHTML = "";


    let count = 0;


    /*
    各イベントを確認
    */

    for(
      const eventDoc
      of eventSnap.docs
    ){

      const eventId =
        eventDoc.id;


      const event =
        eventDoc.data();


      const snap =
        await getDocs(

          collection(
            db,
            "community",
            eventId,
            "times"
          )

        );


      /*
      各Submission
      */

      for(
        const subDoc
        of snap.docs
      ){

        const sub =
          subDoc.data();


        /*
        Pending以外は表示しない
        */

        if(
          sub.status !== "pending"
        ){

          continue;

        }


        count++;


        submissionsDiv.innerHTML += `

          <div class="submission">

            <h3>
              ${escapeHTML(
                sub.username || "Unknown user"
              )}
            </h3>

            <p>
              Event:
              ${escapeHTML(
                event.name || "Unknown event"
              )}
            </p>

            <p>
              Time:
              <strong>
                ${Number(sub.time).toFixed(3)}
              </strong>
            </p>

            <p>
              Submitted:
              ${formatDate(
                sub.submittedAt
              )}
            </p>

            ${
              sub.screenshotURL
              ?
              `
              <img
                class="screenshot"
                src="${escapeHTML(
                  sub.screenshotURL
                )}"
                alt="Submission screenshot"
              >
              `
              :
              ""
            }


            <button
              class="approve"
              onclick="
                approveSubmission(
                  '${eventId}',
                  '${subDoc.id}'
                )
              "
            >
              ✅ Approve
            </button>


            <button
              class="reject"
              onclick="
                rejectSubmission(
                  '${eventId}',
                  '${subDoc.id}'
                )
              "
            >
              ❌ Reject
            </button>

          </div>

        `;

      }

    }


    /*
    Pendingなし
    */

    if(count === 0){

      submissionsDiv.innerHTML =
        "<p>No pending submissions.</p>";

    }

  }

  catch(error){

    console.error(
      "Load submissions error:",
      error
    );


    submissionsDiv.innerHTML =
      "<p class='error'>Failed to load submissions.</p>";

  }

}


/*
========================================
APPROVE
========================================
*/

window.approveSubmission =
async function(
  eventId,
  userId
){

  /*
  管理者確認
  */

  if(!currentAdmin){

    alert(
      "You must be logged in as an administrator."
    );

    return;

  }


  try{

    /*
    Submission
    */

    const subRef =
      doc(
        db,
        "community",
        eventId,
        "times",
        userId
      );


    const subSnap =
      await getDoc(subRef);


    if(!subSnap.exists()){

      alert(
        "Submission not found."
      );

      return;

    }


    const sub =
      subSnap.data();


    /*
    すでに処理済みなら停止
    */

    if(
      sub.status !== "pending"
    ){

      alert(
        "This submission has already been processed."
      );

      return;

    }


    /*
    APPROVED
    */

    await updateDoc(

      subRef,

      {

        status:"approved",

        approvedAt:
          Date.now(),

        approvedBy:
          currentAdmin.uid

      }

    );


    /*
    ユーザーのポイント
    */

    const userRef =
      doc(
        db,
        "users",
        userId
      );


    const userSnap =
      await getDoc(userRef);


    let currentPoints = 0;


    if(userSnap.exists()){

      currentPoints =
        Number(
          userSnap
            .data()
            .community || 0
        );

    }


    /*
    イベント内のApprovedを取得
    */

    const allSnap =
      await getDocs(

        collection(
          db,
          "community",
          eventId,
          "times"
        )

      );


    let approved = [];


    allSnap.forEach(d=>{

      const data =
        d.data();


      if(
        data.status === "approved"
      ){

        approved.push({

          id:d.id,

          ...data

        });

      }

    });


    /*
    タイム順
    */

    approved.sort(

      (a,b)=>{

        const timeDifference =
          Number(a.time) -
          Number(b.time);


        if(
          timeDifference !== 0
        ){

          return timeDifference;

        }


        return String(a.id)
          .localeCompare(
            String(b.id)
          );

      }

    );


    /*
    今回承認したユーザーの順位
    */

    const position =
      approved.findIndex(

        p =>
          p.id === userId

      ) + 1;


    /*
    ポイント計算
    */

    const points =
      calculatePoints(
        position
      );


    /*
    ユーザーにポイント加算
    */

    await setDoc(

      userRef,

      {

        username:
          sub.username,

        community:
          currentPoints + points

      },

      {

        merge:true

      }

    );


    /*
    表示更新
    */

    await loadSubmissions();


    alert(
      `Approved!\nPosition: ${position}\nPoints: +${points}`
    );

  }

  catch(error){

    console.error(
      "Approve error:",
      error
    );


    alert(
      "Failed to approve submission:\n" +
      error.message
    );

  }

};


/*
========================================
REJECT
========================================
*/

window.rejectSubmission =
async function(
  eventId,
  userId
){

  /*
  管理者確認
  */

  if(!currentAdmin){

    alert(
      "You must be logged in as an administrator."
    );

    return;

  }


  try{

    const submissionRef =
      doc(
        db,
        "community",
        eventId,
        "times",
        userId
      );


    const submissionSnap =
      await getDoc(
        submissionRef
      );


    if(
      !submissionSnap.exists()
    ){

      alert(
        "Submission not found."
      );

      return;

    }


    const submission =
      submissionSnap.data();


    /*
    すでに処理済み
    */

    if(
      submission.status !== "pending"
    ){

      alert(
        "This submission has already been processed."
      );

      return;

    }


    /*
    REJECTED
    */

    await updateDoc(

      submissionRef,

      {

        status:"rejected",

        rejectedAt:
          Date.now(),

        rejectedBy:
          currentAdmin.uid

      }

    );


    /*
    表示更新
    */

    await loadSubmissions();


    alert(
      "Submission rejected."
    );

  }

  catch(error){

    console.error(
      "Reject error:",
      error
    );


    alert(
      "Failed to reject submission:\n" +
      error.message
    );

  }

};


/*
========================================
POINTS
========================================
*/

function calculatePoints(position){

  const points = {

    1:100,

    2:90,

    3:80,

    4:70,

    5:60,

    6:50,

    7:40,

    8:30,

    9:20,

    10:10

  };


  return points[position] || 0;

}


/*
========================================
FORMAT DATE
========================================
*/

function formatDate(timestamp){

  if(!timestamp){

    return "-";

  }


  const date =
    new Date(
      Number(timestamp)
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "-";

  }


  return date.toLocaleString(

    "ja-JP",

    {

      year:"numeric",

      month:"2-digit",

      day:"2-digit",

      hour:"2-digit",

      minute:"2-digit"

    }

  );

}


/*
========================================
ESCAPE HTML
========================================
*/

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/*
========================================
AUTH STATE
========================================

Firebaseのログイン状態が
確定してからAdminを開始する。
*/

onAuthStateChanged(

  auth,

  async user=>{

    /*
    ====================================
    NOT LOGGED IN
    ====================================
    */

    if(!user){

      adminStatus.innerHTML =
        "<p class='error'>Not logged in. Redirecting...</p>";

      /*
      少し待ってからログインページへ
      */

      setTimeout(()=>{

        location.href =
          "index.html";

      },500);

      return;

    }


    /*
    ====================================
    ADMIN CHECK
    ====================================
    */

    if(
      !checkAdmin(user)
    ){

      adminStatus.innerHTML =

        "<p class='error'>" +
        "Access denied." +
        "</p>" +

        "<p>" +
        "This account is not an administrator." +
        "</p>";

      /*
      Admin機能を無効化
      */

      createButton.disabled = true;

      eventsDiv.innerHTML =
        "<p class='error'>Administrator access required.</p>";

      submissionsDiv.innerHTML =
        "<p class='error'>Administrator access required.</p>";

      return;

    }


    /*
    ====================================
    ADMIN LOGIN SUCCESS
    ====================================
    */

    currentAdmin = user;


    adminStatus.innerHTML = `

      <div class="admin-email">

        ✅ Logged in as administrator

        <br><br>

        <strong>
          ${escapeHTML(
            user.email
          )}
        </strong>

      </div>

    `;


    /*
    ====================================
    LOAD DATA
    ====================================
    */

    await loadEvents();

    await loadSubmissions();

  }

);

</script>

</body>

</html>
