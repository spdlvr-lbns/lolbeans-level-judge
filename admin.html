<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;padding:20px;}
.card{background:#1e293b;border-radius:15px;padding:20px;max-width:900px;margin:auto;}
input{width:100%;padding:10px;border:none;border-radius:8px;margin:10px 0;}
button{padding:10px 16px;background:#7c3aed;color:white;border:none;border-radius:8px;cursor:pointer;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{padding:10px;border-bottom:1px solid #334155;text-align:left;}
.hidden{display:none;}
</style>
</head>
<body>

<div class="card" id="loginBox">
<h2>🔒 Admin Login</h2>
<input id="adminPass" type="password" placeholder="Admin Password">
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<div class="card hidden" id="panel">
<h2>🏁 Community Submissions</h2>
<p>Only approved submissions count.</p>

<table>
<thead>
<tr>
<th>Player</th>
<th>Time</th>
<th>Status</th>
<th>Remove</th>
</tr>
</thead>
<tbody id="list">
<tr>
<td>ExamplePlayer</td>
<td>28.442</td>
<td>Pending</td>
</tr>
</tbody>
</table>
</div>

<script type="module">
import { db } from "./firebase.js";
import {
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const tbody = document.getElementById("list");

async function load(){

  tbody.innerHTML = "";

  const snap = await getDocs(
    collection(db,"community","september2026","times")
  );

  snap.forEach(d=>{

    const p = d.data();

tbody.innerHTML += `
<tr>
  <td>${p.username}</td>
  <td>${p.time.toFixed(3)}</td>
  <td>${p.invalid ? "Removed" : "Live"}</td>
  <td>
    <button onclick="removeRun('${d.id}')">
      🗑 Remove
    </button>
  </td>
</tr>
`;

  });

}

window.approve = async(id)=>{

  await updateDoc(
    doc(db,"community","september2026","times",id),
    { approved:true }
  );

  load();

};

load();
</script>
</script>

</body>
</html>
