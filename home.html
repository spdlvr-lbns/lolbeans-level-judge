<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOLBeans Home</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.card{
  background:#1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}
input{
  width:100%;
  margin:8px 0;
}
.nav{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.nav a{
  text-decoration:none;
  color:white;
  background:#334155;
  padding:10px 14px;
  border-radius:8px;
}
</style>
</head>
<body>

<div class="container">

<div class="card">
  <h1>👋 Welcome, <span id="username">Player</span></h1>
  <h2 id="grade">D</h2>
  <h3 id="total">0 / 550</h3>
</div>

<div class="card">
  <div class="nav">
    <a href="community.html">🌍 Community</a>
    <a href="ranking.html">🏆 Rankings</a>
    <a href="admin.html">👑 Admin</a>
  </div>
</div>

<div class="card">
  <h2>⏱ Speedrun</h2>
  <input id="speed" type="range" min="490" max="1200" value="1200">
  <p>Time: <span id="speedValue">1200</span></p>
  <p id="speedPts">0 / 300</p>
</div>

<div class="card">
  <h2>🏆 Battle Royale Wins</h2>
  <input id="wins" type="range" min="0" max="10000" value="0">
  <p>Wins: <span id="winsValue">0</span></p>
  <p id="winPts">0 / 100</p>
</div>

<div class="card">
  <h2>🏷 Tag Score</h2>
  <input id="tag" type="range" min="0" max="2000" value="0">
  <p>Score: <span id="tagValue">0</span></p>
  <p id="tagPts">0 / 50</p>
</div>

<div class="card">
  <h2>🌍 Community</h2>
  <h3 id="community">0 pt</h3>
  <p>Monthly Community Points</p>
</div>

<div class="card">
  <button id="saveBtn">💾 Save Stats</button>
  <p id="msg"></p>
</div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const speed=document.getElementById("speed");
const wins=document.getElementById("wins");
const tag=document.getElementById("tag");

let communityPoints=0;
let currentUID="";
let currentUsername="";

function calc(){

  const s=Math.max(0,Math.min(300,
    Math.round((1200-Number(speed.value))/710*300)
  ));

  const w=Math.round((Number(wins.value)/10000)*100);
  const t=Math.round((Number(tag.value)/2000)*50);

  const total=s+w+t+communityPoints;

  document.getElementById("speedValue").textContent=speed.value;
  document.getElementById("winsValue").textContent=wins.value;
  document.getElementById("tagValue").textContent=tag.value;

  document.getElementById("speedPts").textContent=s+" / 300";
  document.getElementById("winPts").textContent=w+" / 100";
  document.getElementById("tagPts").textContent=t+" / 50";

  document.getElementById("total").textContent=total+" / 550";

  let grade="D";
  if(total>=500) grade="SS";
  else if(total>=400) grade="S";
  else if(total>=300) grade="A";
  else if(total>=200) grade="B";
  else if(total>=100) grade="C";

  document.getElementById("grade").textContent=grade;

  return {s,w,t,total,grade};
}

speed.oninput=calc;
wins.oninput=calc;
tag.oninput=calc;

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    location.href="index.html";
    return;
  }

  currentUID=user.uid;
  currentUsername=user.email.replace("@lbns.gg","");

  document.getElementById("username").textContent=currentUsername;

  const ref=doc(db,"users",user.uid);
  const snap=await getDoc(ref);

  if(snap.exists()){

    const d=snap.data();

    speed.value=d.speedrun||1200;
    wins.value=d.wins||0;
    tag.value=d.tag||0;

    communityPoints=d.community||0;

    document.getElementById("community").textContent=
      communityPoints+" pt";
  }

  calc();

});

document.getElementById("saveBtn").onclick=async()=>{

  const score=calc();

  await setDoc(
    doc(db,"users",currentUID),
    {
      username:currentUsername,
      speedrun:Number(speed.value),
      wins:Number(wins.value),
      tag:Number(tag.value),
      community:communityPoints,
      total:score.total,
      grade:score.grade
    },
    {merge:true}
  );

  document.getElementById("msg").textContent=
    "✅ Saved!";

};

</script>

</body>
</html>
