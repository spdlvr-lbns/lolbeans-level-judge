<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Challenge</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.card{
  background:#1e293b;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}
input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  margin:10px 0;
  box-sizing:border-box;
}
button{
  width:100%;
  padding:12px;
  background:#7c3aed;
  color:white;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border-bottom:1px solid #334155;
  text-align:left;
}
a{
  color:#a78bfa;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<a href="home.html">← Home</a>

<div class="card">
<h1 id="eventTitle">🌍 Community Challenge</h1>
<p id="eventMap">Loading event...</p>
  <input id="time" type="number" step="0.001" placeholder="28.442">
<label>Screenshot (Required)</label>

<input
  id="screenshot"
  type="file"
  accept="image/*"
>

<p id="fileName"></p><label>Screenshot (Required)</label>

<input
  id="screenshot"
  type="file"
  accept="image/*"
>

<p id="fileName"></p>
  
  <button id="submitBtn">Submit Time</button>

  <p id="msg"></p>
</div>

<div class="card">
  <h2>🏆 Live Ranking</h2>

  <table>
<thead>
  <tr>
    <th>#</th>
    <th>Player</th>
    <th>Time</th>
    <th>Pt</th>
  </tr>
</thead>

    <tbody id="ranking"></tbody>

  </table>
</div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
  collection,
  doc,
  setDoc,
  getDocs,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const ranking = document.getElementById("ranking");
const eventTitle = document.getElementById("eventTitle");
const eventMap = document.getElementById("eventMap");

let currentEvent = "";
async function loadEvent(){

  const snap = await getDocs(collection(db,"events"));

  snap.forEach(d=>{

    const e = d.data();

    if(e.active){

      currentEvent = d.id;

      eventTitle.textContent = "🌍 " + e.name;
      eventMap.textContent = e.map;

    }

  });


}
const msg=document.getElementById("msg");
const screenshot =
  document.getElementById("screenshot");

screenshot.onchange = () => {

  if(screenshot.files.length){
    document.getElementById("fileName")
      .textContent =
      "📷 " + screenshot.files[0].name;

  }

};
  
async function loadRanking(){

  ranking.innerHTML="";

  const snap=await getDocs(
  collection(db,"community",currentEvent,"times")
  );

  let players=[];

  snap.forEach(d=>{
    players.push(d.data());
  });

  players.sort((a,b)=>a.time-b.time);
  players.forEach((p,i)=>{
  p.rank = i + 1;
  p.points = Math.max(0, 110 - (p.rank * 10));
});

players.forEach((p,i)=>{

  p.rank = i + 1;
  p.points = Math.max(0,110-p.rank*10);

  ranking.innerHTML += `
    <tr>
      <td>${p.rank}</td>
      <td>${p.username}</td>
      <td>${p.time.toFixed(3)}</td>
      <td>${p.points}</td>
    </tr>
  `;

});

}

document.getElementById("submitBtn").onclick=async()=>{

  const user=auth.currentUser;

  if(!user){
    msg.textContent="Please login first.";
    return;
  }

  const t=Number(document.getElementById("time").value);

if(screenshot.files.length===0){

  msg.textContent =
    "Screenshot is required.";

  return;

}
  
  if(!t){
    msg.textContent="Enter a valid time.";
    return;
  }

  const username=user.email.replace("@lbns.gg","");

  await setDoc(
  doc(db,"community",currentEvent,"times",user.uid),
  {
    username,
    time:t,
    points:0,
    rank:0,
    approved:false,
    submittedAt: Date.now()
  }
);

  msg.textContent="Time submitted!";
  loadRanking();

};

loadEvent();
loadRanking();

</script>

</body>
</html>
