<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Challenge</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.card{
  background:#1e293b;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}
input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  margin:10px 0;
  box-sizing:border-box;
}
button{
  width:100%;
  padding:12px;
  background:#7c3aed;
  color:white;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border-bottom:1px solid #334155;
  text-align:left;
}
a{
  color:#a78bfa;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<a href="home.html">← Home</a>

<div class="card">
  <h1>🌍 September Challenge</h1>
  <p>Enter your best time (seconds)</p>

  <input id="time" type="number" step="0.001" placeholder="28.442">

  <button id="submitBtn">Submit Time</button>

  <p id="msg"></p>
</div>

<div class="card">
  <h2>🏆 Live Ranking</h2>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th>Time</th>
      </tr>
    </thead>

    <tbody id="ranking"></tbody>

  </table>
</div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
  collection,
  doc,
  setDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const ranking=document.getElementById("ranking");
const msg=document.getElementById("msg");

async function loadRanking(){

  ranking.innerHTML="";

  const snap=await getDocs(
    collection(db,"community","september2026","times")
  );

  let players=[];

  snap.forEach(d=>{
    players.push(d.data());
  });

  players.sort((a,b)=>a.time-b.time);

  players.forEach((p,i)=>{
    ranking.innerHTML += `
      <tr>
        <td>${i+1}</td>
        <td>${p.username}</td>
        <td>${p.time.toFixed(3)}</td>
      </tr>
    `;
  });

}

document.getElementById("submitBtn").onclick=async()=>{

  const user=auth.currentUser;

  if(!user){
    msg.textContent="Please login first.";
    return;
  }

  const t=Number(document.getElementById("time").value);

  if(!t){
    msg.textContent="Enter a valid time.";
    return;
  }

  const username=user.email.replace("@lbns.gg","");

  await setDoc(
    doc(db,"community","september2026","times",user.uid),
    {
      username,
      time:t
    }
  );

  msg.textContent="Time submitted!";
  loadRanking();

};

loadRanking();

</script>

</body>
</html>
