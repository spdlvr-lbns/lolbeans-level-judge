<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community Challenge</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  margin:10px 0;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  background:#7c3aed;
  color:white;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#6d28d9;
}

button:disabled{
  background:#475569;
  cursor:not-allowed;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #334155;
  text-align:left;
}

a{
  color:#a78bfa;
  text-decoration:none;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
}

.active{
  background:#166534;
  color:#bbf7d0;
}

.ended{
  background:#7f1d1d;
  color:#fecaca;
}

.waiting{
  background:#92400e;
  color:#fde68a;
}

.pending{
  color:#fbbf24;
}

.approved{
  color:#86efac;
}

.rejected{
  color:#fca5a5;
}

.countdown{
  margin-top:10px;
  font-weight:bold;
  color:#c4b5fd;
}

.message{
  margin-top:10px;
  font-weight:bold;
}

.success{
  color:#86efac;
}

.error{
  color:#fca5a5;
}

.info{
  color:#c4b5fd;
}

.preview{
  max-width:100%;
  max-height:300px;
  margin-top:10px;
  border-radius:10px;
  display:none;
}

.points{
  font-size:28px;
  font-weight:bold;
  color:#c4b5fd;
}

</style>
</head>

<body>

<div class="container">

<a href="home.html">← Home</a>

<div class="card">

<h1 id="eventTitle">🌍 Community Challenge</h1>

<p id="eventMap">Loading event...</p>

<p id="eventStatus"></p>

<p id="eventDates"></p>

<p id="countdown" class="countdown"></p>

</div>


<div class="card" id="submissionCard">

<h2>Submit Your Time</h2>

<input
  id="time"
  type="number"
  step="0.001"
  placeholder="28.442"
>

<label>
Screenshot (Required)
</label>

<input
  id="screenshot"
  type="file"
  accept="image/*"
>

<p id="fileName"></p>

<img
  id="preview"
  class="preview"
>

<button id="submitBtn">
Submit Time
</button>

<p id="msg" class="message"></p>

</div>


<div class="card">

<h2>🏆 Live Ranking</h2>

<table>

<thead>

<tr>
<th>#</th>
<th>Player</th>
<th>Time</th>
<th>Pt</th>
</tr>

</thead>

<tbody id="ranking">

<tr>
<td colspan="4">
Loading...
</td>
</tr>

</tbody>

</table>

</div>


<div class="card">

<h2>⭐ My Community Points</h2>

<p class="points" id="myPoints">
0 pt
</p>

</div>

</div>


<script type="module">

import { auth, db, storage } from "./firebase.js";

import {
  collection,
  doc,
  setDoc,
  getDocs,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";


const eventTitle =
  document.getElementById("eventTitle");

const eventMap =
  document.getElementById("eventMap");

const eventStatus =
  document.getElementById("eventStatus");

const eventDates =
  document.getElementById("eventDates");

const countdown =
  document.getElementById("countdown");

const submissionCard =
  document.getElementById("submissionCard");

const submitBtn =
  document.getElementById("submitBtn");

const screenshot =
  document.getElementById("screenshot");

const fileName =
  document.getElementById("fileName");

const preview =
  document.getElementById("preview");

const msg =
  document.getElementById("msg");

const ranking =
  document.getElementById("ranking");

const myPoints =
  document.getElementById("myPoints");


let currentEvent = "";

let currentEventData = null;

let countdownTimer = null;


/* =========================
   DATE
========================= */

function getTimestamp(value){

  if(!value) return 0;

  if(typeof value.toMillis === "function"){
    return value.toMillis();
  }

  return new Date(value).getTime();

}


function formatDate(timestamp){

  return new Date(timestamp).toLocaleString(
    "ja-JP",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================
   EVENT
========================= */

async function loadEvent(){

  const snap =
    await getDocs(
      collection(db,"events")
    );

  const now = Date.now();

  let activeEvent = null;

  let activeId = "";

  let nextEvent = null;

  let nextId = "";

  snap.forEach(d=>{

    const e = d.data();

    const start =
      getTimestamp(e.startAt);

    const end =
      getTimestamp(e.endAt);

    if(
      start &&
      end &&
      now >= start &&
      now < end
    ){

      if(
        !activeEvent ||
        start > activeEvent._start
      ){

        activeEvent = e;

        activeEvent._start = start;

        activeEvent._end = end;

        activeId = d.id;

      }

    }

    if(
      start &&
      now < start
    ){

      if(
        !nextEvent ||
        start < nextEvent._start
      ){

        nextEvent = e;

        nextEvent._start = start;

        nextEvent._end = end;

        nextId = d.id;

      }

    }

  });


  if(activeEvent){

    currentEvent = activeId;

    currentEventData = activeEvent;

    showActiveEvent();

  }

  else if(nextEvent){

    currentEvent = "";

    currentEventData = nextEvent;

    showWaitingEvent();

  }

  else{

    currentEvent = "";

    currentEventData = null;

    showNoEvent();

  }

}


/* =========================
   ACTIVE
========================= */

function showActiveEvent(){

  const e = currentEventData;

  eventTitle.textContent =
    "🌍 " + e.name;

  eventMap.textContent =
    "🗺️ Map: " + e.map;

  eventStatus.innerHTML =
    '<span class="status active">🟢 EVENT ACTIVE</span>';

  eventDates.textContent =
    "📅 " +
    formatDate(e._start) +
    " ～ " +
    formatDate(e._end);

  submissionCard.style.display =
    "block";

  submitBtn.disabled = false;

  startCountdown(e._end,false);

}


/* =========================
   WAITING
========================= */

function showWaitingEvent(){

  const e = currentEventData;

  eventTitle.textContent =
    "🌍 " + e.name;

  eventMap.textContent =
    "🗺️ Map: " + e.map;

  eventStatus.innerHTML =
    '<span class="status waiting">🟡 NOT STARTED</span>';

  eventDates.textContent =
    "📅 " +
    formatDate(e._start) +
    " ～ " +
    formatDate(e._end);

  submissionCard.style.display =
    "none";

  ranking.innerHTML =
    '<tr><td colspan="4">Event has not started yet.</td></tr>';

  startCountdown(e._start,true);

}


/* =========================
   NO EVENT
========================= */

function showNoEvent(){

  eventTitle.textContent =
    "🌍 Community Challenge";

  eventMap.textContent =
    "There is currently no active event.";

  eventStatus.innerHTML =
    '<span class="status ended">🔴 NO ACTIVE EVENT</span>';

  eventDates.textContent = "";

  countdown.textContent = "";

  submissionCard.style.display =
    "none";

  ranking.innerHTML =
    '<tr><td colspan="4">No active event.</td></tr>';

}


/* =========================
   COUNTDOWN
========================= */

function startCountdown(target,starting){

  if(countdownTimer){

    clearInterval(countdownTimer);

  }

  function update(){

    const difference =
      target - Date.now();

    if(difference <= 0){

      clearInterval(countdownTimer);

      countdown.textContent =
        starting
        ? "Starting..."
        : "⏰ Event ended.";

      setTimeout(async()=>{

        await loadEvent();

        await loadRanking();

      },1000);

      return;

    }

    const seconds =
      Math.floor(difference / 1000);

    const days =
      Math.floor(seconds / 86400);

    const hours =
      Math.floor(
        (seconds % 86400) / 3600
      );

    const minutes =
      Math.floor(
        (seconds % 3600) / 60
      );

    const secs =
      seconds % 60;

    countdown.textContent =
      starting

      ? `⏳ Starts in ${days}d ${hours}h ${minutes}m ${secs}s`

      : `⏱️ Ends in ${days}d ${hours}h ${minutes}m ${secs}s`;

  }

  update();

  countdownTimer =
    setInterval(update,1000);

}


/* =========================
   SCREENSHOT PREVIEW
========================= */

screenshot.onchange = ()=>{

  if(!screenshot.files.length){

    return;

  }

  const file =
    screenshot.files[0];

  fileName.textContent =
    "📷 " + file.name;

  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

};


/* =========================
   RANKING
========================= */

async function loadRanking(){

  if(!currentEvent){

    return;

  }

  const snap =
    await getDocs(
      collection(
        db,
        "community",
        currentEvent,
        "times"
      )
    );

  let players = [];

  snap.forEach(d=>{

    const p = d.data();

    if(p.status === "approved"){

      players.push(p);

    }

  });


  players.sort(
    (a,b)=>
      Number(a.time)-Number(b.time)
  );


  ranking.innerHTML = "";


  players.forEach((p,i)=>{

    const points =
      calculatePoints(i+1);

    ranking.innerHTML += `

      <tr>

        <td>${i+1}</td>

        <td>${escapeHTML(p.username)}</td>

        <td>
          ${Number(p.time).toFixed(3)}
        </td>

        <td>
          ${points}
        </td>

      </tr>

    `;

  });


  if(players.length === 0){

    ranking.innerHTML =
      '<tr><td colspan="4">No approved submissions yet.</td></tr>';

  }

}


/* =========================
   POINTS
========================= */

function calculatePoints(position){

  const points = {

    1:100,
    2:90,
    3:80,
    4:70,
    5:60,
    6:50,
    7:40,
    8:30,
    9:20,
    10:10

  };

  return points[position] || 0;

}


/* =========================
   MY POINTS
========================= */

async function loadMyPoints(){

  const user =
    auth.currentUser;

  if(!user){

    myPoints.textContent =
      "Login required";

    return;

  }

  const snap =
    await getDoc(
      doc(db,"users",user.uid)
    );

  if(snap.exists()){

    const data =
      snap.data();

    myPoints.textContent =
      `${data.community || 0} pt`;

  }

}


/* =========================
   SUBMIT
========================= */

submitBtn.onclick = async()=>{

  msg.textContent = "";

  const user =
    auth.currentUser;

  if(!user){

    msg.textContent =
      "Please login first.";

    msg.className =
      "message error";

    return;

  }


  await loadEvent();


  if(
    !currentEvent ||
    !currentEventData
  ){

    msg.textContent =
      "No active event.";

    msg.className =
      "message error";

    return;

  }


  const now =
    Date.now();


  if(
    now < currentEventData._start ||
    now >= currentEventData._end
  ){

    msg.textContent =
      "⏰ This event is not active.";

    msg.className =
      "message error";

    return;

  }


  const time =
    Number(
      document.getElementById("time").value
    );


  if(
    !Number.isFinite(time) ||
    time <= 0
  ){

    msg.textContent =
      "Enter a valid time.";

    msg.className =
      "message error";

    return;

  }


  if(!screenshot.files.length){

    msg.textContent =
      "Screenshot is required.";

    msg.className =
      "message error";

    return;

  }


  submitBtn.disabled = true;

  msg.textContent =
    "Uploading screenshot...";

  msg.className =
    "message info";


  try{

    const file =
      screenshot.files[0];


    /*
    Firebase Storage
    */

    const storagePath =
      `community/${currentEvent}/${user.uid}_${Date.now()}`;

    const storageRef =
      ref(storage,storagePath);


    await uploadBytes(
      storageRef,
      file
    );


    const screenshotURL =
      await getDownloadURL(storageRef);


    const username =
      user.email
      ? user.email.replace("@lbns.gg","")
      : "Player";


    /*
    Firestore
    */

    await setDoc(

      doc(
        db,
        "community",
        currentEvent,
        "times",
        user.uid
      ),

      {

        username,

        time,

        screenshotURL,

        submittedAt:Date.now(),

        status:"pending"

      }

    );


    msg.textContent =
      "✅ Submitted! Waiting for approval.";

    msg.className =
      "message success";


    screenshot.value = "";

    fileName.textContent = "";

    preview.style.display =
      "none";


  }catch(error){

    console.error(error);

    msg.textContent =
      "Failed to submit.";

    msg.className =
      "message error";

  }


  submitBtn.disabled = false;

};


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

await loadEvent();

await loadRanking();

await loadMyPoints();


/*
30秒ごとにイベント更新
*/

setInterval(async()=>{

  await loadEvent();

  await loadRanking();

  await loadMyPoints();

},30000);

</script>

</body>
</html>
